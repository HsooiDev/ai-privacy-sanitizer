name: CI & Release Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests & Self-Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install Linux X11/Tkinter dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev xvfb xclip

      - name: Install Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt

      - name: Run pytest suite (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -v

      - name: Run pytest suite (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -v

      - name: Check Web restoration and masked preview boundaries
        run: node tests/test_web_security.cjs

      - name: Run CLI self-test
        run: python -m src.main --self-test

  release-windows:
    name: Build Standalone Windows EXE & Release
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt

      - name: Export multi-resolution shield icon
        run: python -m src.main --export-ico assets/icon.ico

      - name: Package standalone windowed AI-Privacy-Sanitizer.exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "AI-Privacy-Sanitizer" --icon "assets/icon.ico" --collect-all customtkinter --hidden-import plyer.platforms.win.notification --exclude-module pytest --exclude-module unittest --exclude-module pdb --exclude-module pydoc src/main.py

      - name: Record source revision and asset checksums
        shell: pwsh
        run: |
          $metadata = @{
            source_commit = (git rev-parse HEAD).Trim()
            source_ref = $env:GITHUB_REF
            workflow_run = $env:GITHUB_RUN_ID
            requirements_sha256 = (Get-FileHash requirements-lock.txt -Algorithm SHA256).Hash.ToLowerInvariant()
            python = (python --version)
          }
          $metadata | ConvertTo-Json | Set-Content -Encoding utf8 dist/build-info.json
          $assets = @("dist/AI-Privacy-Sanitizer.exe", "web/index.html", "dist/build-info.json")
          $sums = foreach ($asset in $assets) {
            $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($asset))"
          }
          [IO.File]::WriteAllLines("$pwd/dist/SHA256SUMS", $sums, [Text.UTF8Encoding]::new($false))

      - name: Upload Release Asset to GitHub Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/AI-Privacy-Sanitizer.exe
            web/index.html
            dist/build-info.json
            dist/SHA256SUMS
          generate_release_notes: true
