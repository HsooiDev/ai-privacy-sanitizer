name: Experimental macOS Build

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: "Native target (arm64 = Apple Silicon; x86_64 = Intel)"
        required: true
        type: choice
        default: arm64
        options:
          - arm64
          - x86_64

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ inputs.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 30
    steps:
      - name: Checkout selected source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up native Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-macos-lock.txt

      - name: Install hashed build dependencies
        run: python -m pip install --require-hashes -r requirements-macos-lock.txt

      - name: Run focused packaging integration checks
        run: python -m pytest -q tests/test_macos_packaging.py

      - name: Build and verify experimental app and disk image
        env:
          TARGET_ARCH: ${{ inputs.architecture }}
        run: python scripts/build_macos.py --arch "$TARGET_ARCH"

      - name: Save experimental build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: experimental-macos-${{ inputs.architecture }}
          path: |
            dist/macos/${{ inputs.architecture }}/*.zip
            dist/macos/${{ inputs.architecture }}/*.dmg
            dist/macos/${{ inputs.architecture }}/build-info.json
            dist/macos/${{ inputs.architecture }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
